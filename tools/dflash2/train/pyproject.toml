[project]
name = "dflash2-train"
version = "0.0.0"
description = "Torch reference forward and engine-parity harness for the DFlash2 drafter"
requires-python = ">=3.12,<3.13"
dependencies = [
    # PyPI aarch64 wheel; bundles CUDA 13.2 and has sm_121 kernels for the GB10.
    "torch==2.15.0",
    "numpy>=2.1,<3",
    "safetensors>=0.5",
]

# These scripts are run as scripts, not installed as a package.
[tool.uv]
package = false
